name: Actualizar datos RFFM
# El nombre lleva el código que manda el botón de la app, para que la app sepa qué ejecución seguir
run-name: ${{ inputs.id && format('Actualizar {0}', inputs.id) || 'Actualizar datos RFFM' }}

on:
  schedule:
    # Los horarios de GitHub no son fiables (se salta muchos); el aviso de verdad viene de fuera
    # (cron-job.org) o del botón de la app. Estos quedan solo de reserva.
    - cron: "37 * * * *"              # cada hora, rápida
    - cron: "4,24,44 7,8 * * 1"       # lunes entre las 9 y las 11 (hora de Madrid), rápida
    - cron: "23 1 * * *"              # cada noche, completa
  workflow_dispatch:
    inputs:
      modo:
        description: "rapida (solo calendarios y actas) o completa (busca también los equipos del club)"
        default: "rapida"
      id:
        description: "Código de la app para seguir el progreso (opcional)"
        default: ""
      minutos:
        description: "Minutos máximos leyendo actas"
        default: "25"

concurrency:
  group: actualizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar la app
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar programas
        run: npm install --no-audit --no-fund
      - name: Preparar navegador
        run: |
          if command -v google-chrome >/dev/null; then echo "Chrome ya instalado: $(google-chrome --version)"
          else npx playwright install --with-deps chromium; fi
      - name: Leer la web de la RFFM
        run: node scrape.mjs
        env:
          MODO: ${{ inputs.modo || (github.event.schedule == '23 1 * * *' && 'completa') || 'rapida' }}
          MINUTOS: ${{ inputs.minutos || '25' }}
          CANAL: chrome
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json debug
          git diff --cached --quiet || git commit -m "Actualizar datos RFFM"
          # Por si mientras tanto se subieron otros cambios a la página
          git pull --rebase -X theirs origin main || true
          git push
